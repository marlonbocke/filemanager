<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: url("DJI_0566.jpeg") no-repeat center center fixed;
      }

      .login-container {
        background: #ffffff;
        padding: 30px;
        width: 320px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      .login-container h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }

      input:focus {
        outline: none;
        border-color: #4caf50;
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.4);
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.3s;
      }

      button:hover {
        background-color: #43a047;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <h2>Login</h2>
      <form method="post" action="login.php">
        <label>Nutzer</label>
        <!--  <input type="text" name="nutzer" placeholder="Benutzername">    -->
        <input type="text" name="nutzer" value="marlon" />
        <label>Passwort</label>
        <!-- <input type="password" name="passwort" placeholder="Passwort"> -->
        <input type="password" name="passwort" value="" />
        <button type="submit">Anmelden</button>
      </form>
      <a href="/filemanager_new/config.html"> Configuration pages</a>
    </div>
  </body>
</html>
